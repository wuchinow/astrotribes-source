# The local stack, used for the database tests (`npm run test:db`). Nothing here configures the
# live project: its Auth and Data API settings are set in the dashboard (runbook, Setup in the
# browser). No secrets in this file; a value that needs one is written as env(NAME).
# Every key not listed keeps the CLI's default: https://supabase.com/docs/guides/local-development/cli/config

project_id = "astrotribes"

[api]
enabled = true
# Schemas the Data API serves. `private` (the functions the policies call) is never listed.
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
# Matches the live project (Postgres 17.6).
major_version = 17

[db.migrations]
enabled = true

# No seed file, ever: test users are synthetic and live only inside a test's transaction
# (invariant 8).
[db.seed]
enabled = false

[auth]
enabled = true
site_url = "http://127.0.0.1:3000"
enable_signup = true
enable_anonymous_sign_ins = false

[auth.email]
enable_signup = true
enable_confirmations = true

[realtime]
enabled = false

[storage]
enabled = false

[studio]
enabled = false
